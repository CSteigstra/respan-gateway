[package]
name = "respan-gateway-google-auth"
description = "Google access tokens from a service account's key or a user's refresh token, minted and refreshed for an HTTP transport."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
http.workspace = true
percent-encoding.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
ring.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
